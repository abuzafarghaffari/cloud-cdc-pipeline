resources:
  jobs:
    customer_cdc_stream_job:
      name: cloud-cdc-incremental-processing

      max_concurrent_runs: 1

      tasks:
        - task_key: process_cdc
          spark_python_task:
            python_file: ../src/cdc_stream.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"